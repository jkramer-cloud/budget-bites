/* V2 nutrition & budgeting visualizations */
.report-explainer{background:#eef6ec;border:1px solid #c4dbc9;border-radius:14px;padding:13px 16px;font-size:.85rem;line-height:1.55;display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center}
.pill-plan{color:#246d52;font-weight:750}.pill-served{color:#ac692b;font-weight:750}
.compare-nutrient{padding:16px 0 15px;border-bottom:1px solid var(--line)}.compare-nutrient:last-of-type{border-bottom:0}
.compare-title{display:flex;gap:9px 14px;flex-wrap:wrap;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.comp-row{display:grid;grid-template-columns:70px minmax(120px,1fr) 96px;gap:10px;align-items:center;margin-bottom:9px;font-size:.82rem}
.comp-row>strong{text-align:right;font-variant-numeric:tabular-nums;font-size:.85rem}.comp-track{height:19px;position:relative;background:#ebf0e9;border-radius:7px;overflow:visible}
.comp-fill{height:100%;position:absolute;top:0;left:0;border-radius:7px}.comp-fill.plan{background:#4c9a80}.comp-fill.cooked{background:#e6a15e}
.comp-guide{position:absolute;top:-4px;bottom:-4px;border-left:3px dashed #6e5240;opacity:.9}
.report-svg{display:block;width:100%;height:auto;min-width:480px}.chart-scroller{width:100%;overflow-x:auto;border:1px solid var(--line);background:#fafcf8;border-radius:14px;padding:12px 6px 3px}
.report-day-table{overflow-x:auto;width:100%;max-width:100%}.report-day-table table{min-width:470px}
.graph-legend{display:flex;flex-wrap:wrap;gap:13px 21px;font-size:.77rem;color:var(--muted)}.graph-legend span{display:flex;align-items:center;gap:6px}
.key{width:13px;height:13px;border-radius:4px;display:inline-block}.key.planned{background:#4c9a80}.key.served{background:#e6a15e}.key.spent{background:#d87a42}.key.open{background:#e6ebe5;border:1px solid #c4cec5}
.budget-stack{height:28px;width:100%;display:flex;overflow:hidden;background:#e6ebe5;border-radius:9px}.budget-stack span{height:100%;display:block}.budget-stack .stack-spent{background:#d87a42}.budget-stack .stack-needed{background:#4c9a80}
.foodgroup-item{display:flex;flex-direction:column;gap:8px;padding:8px 0}.mini-track{height:17px;background:#e9ede6;border-radius:7px;position:relative;overflow:hidden}.mini-track i{position:absolute;inset:0 auto 0 0;display:block;border-radius:7px}.mini-plan{background:#9ac8b5}.mini-served{background:#de964f;opacity:.9;height:55%!important;top:auto!important}

 'pasta-salad':['Cook pasta until tender according to the package; use a colander safely with adult help.','Rinse and chop vegetables. Drain and rinse canned chickpeas.','Cool pasta promptly, toss with vegetables, chickpeas and oil, and refrigerate until serving.'],
 'leftover-chili':['Rinse lentils, then simmer in water according to the package until fully tender.','Cook rice separately; warm tomatoes, onions and spinach with the lentils.','Spoon lentil-tomato mixture over the rice. Refrigerate leftovers promptly.'],
 'chicken-rice':['Cook rice according to package directions. Wash broccoli and carrots before cutting.','Keep raw chicken on a separate board. Cook to 165°F (74°C) in the thickest part, using a thermometer.','Steam vegetables until tender. Mix everything with oil in a clean pan and serve hot.'],
 'lentil-chili':['Rinse lentils; wash and dice onion, bell pepper and carrots with adult assistance.','Simmer lentils with tomatoes and enough water to soften them fully; add chopped vegetables.','Stir in drained black beans, heat thoroughly, and serve in bowls.'],
 'turkey-tacos':['Wash lettuce and pepper. Dice pepper using the claw grip and separate cutting boards.','Cook ground turkey to 165°F (74°C), checking with a thermometer. Stir in chopped pepper and salsa.','Warm tortillas and fill with turkey, shredded lettuce and cheese.'],
 'pasta-tomato':['Cook pasta according to package directions. Wash spinach and dice onion.','Simmer lentils until tender; gently cook onion and tomatoes, then add spinach and lentils.','Toss cooked pasta with tomato-lentil sauce, heat through and serve.'],
 'baked-potato':['Scrub and pierce potatoes with adult help, then bake until completely tender.','Warm black beans and broccoli separately until hot and cooked; wash hands after handling produce.','Split hot potatoes carefully, add beans, broccoli, yogurt and cheese, and serve.'],
 'tofu-stirfry':['Drain tofu; wash and chop broccoli, pepper and carrots. Cook brown rice separately.','With adult supervision, sauté tofu and vegetables in a lightly oiled pan until heated through and tender.','Spoon tofu and vegetables over cooked rice and serve warm.'],
 'chicken-wrap':['Wash lettuce and pepper, slice carefully with adult supervision and warm the tortillas.','Keep raw chicken separate. Cook chicken to 165°F (74°C), checking the thickest part with a thermometer.','Slice cooked chicken using clean tools and fill tortillas with chicken, lettuce, salsa and cheese.'],
 'sweetpotato-beans':['Wash, peel if desired and cut sweet potatoes with adult help. Rinse spinach.','Roast sweet potato pieces until completely tender; prepare brown rice following package directions.','Warm black beans and spinach with salsa. Assemble rice, potato and bean bowls.'],
 'turkey-skillet':['Wash and dice potatoes, carrots, peppers and onions using a stable board.','Keep ground turkey separate from produce; cook to 165°F (74°C) with a thermometer.','Pan-cook vegetables until tender, combine with the fully cooked turkey, and serve.'],
 'chickpea-stew':['Drain and rinse chickpeas; wash spinach and chop onions with adult supervision.','Cook rice as directed. Simmer onions, chickpeas and tomatoes until heated through; stir in spinach.','Serve chickpea stew over cooked rice. Refrigerate any leftovers promptly.'],
 'apple-pb':['Wash and core apples; ask an adult to help slice them safely.','Read peanut butter packaging for allergy information before opening.','Portion peanut butter into individual cups and dip apple slices.'],
 'berries-yogurt':['Wash and drain berries; keep the yogurt chilled until serving.','Spoon yogurt into small clean bowls and top with fresh berries.','Serve promptly and refrigerate unused dairy ingredients.'],
 'veggie-hummus':['Rinse carrots and cucumbers under running water.','With adult supervision, slice carrots and cucumbers into safe dipping sizes.','Spoon hummus into separate bowls, arrange vegetable sticks and serve.'],
 'banana-milk':['Wash hands and wipe down the preparation area.','Peel bananas and divide into portions; pour milk into clean cups.','Serve immediately and refrigerate remaining milk.'],
 'popcorn-fruit':['Wash and cut oranges into wedges with adult supervision.','Pop kernels with oil using an appropriate covered popcorn popper or pot under adult supervision. Avoid steam burns.','Let the popcorn cool slightly before serving alongside orange slices.'],
 'toast-raisins':['Wash and slice bananas safely; have the raisins ready.','Toast bread, then sprinkle with cinnamon and add banana slices and raisins.','Share between family members and serve.'],
 "pumpkin-spice-oats":["Wash and dice apples carefully with adult help.","Simmer oats in milk and enough water according to the package; stir in cinnamon.","Top warm oats with apple pieces and sunflower seeds."],

 "orange-quinoa":["Rinse quinoa according to package directions.","With adult supervision, simmer quinoa until tender, then cool slightly.","Top portions with orange segments, yogurt, raisins and cinnamon."],

 "sweetpotato-hummus":["Scrub sweet potatoes, cut with adult help and lightly oil.","Roast under adult supervision until fully tender.","Serve with washed spinach, hummus and whole-wheat toast."],
 "chicken-cabbage-wrap":["Rinse and shred cabbage and carrots with adult supervision; warm tortillas.","Keep raw chicken separate from produce; cook to 165°F (74°C) and verify with a thermometer.","Cut cooked chicken with clean utensils, fill tortillas and add chilled yogurt-lemon sauce."],

 "turkey-cabbage-skillet":["Cook brown rice separately. Wash and chop cabbage, carrot and onion.","Cook ground turkey to 165°F (74°C) using a food thermometer.","Cook vegetables until tender and combine with fully cooked turkey and rice."],

function bbLabStepDone(s,step){const p=s.progress||{};switch(step.action){
 case 'sequence':case 'combine':return (p.index||0)>=step.sequence.length;
 case 'collect':return step.required.every(t=>(p.selected||[]).includes(t));
 case 'measure':return Math.abs((p.amount||0)-step.target)<0.001;
 case 'chop':return (p.cuts||[]).length>=step.target;
 case 'stir':return (p.turns||0)>=step.target;
 case 'timer':return (p.checks||0)>=step.target;
 case 'portion':return (p.plates||0)>=step.target;

function bbLabGrade(s,r){
 const m=s.mistakesBy||{}, total=s.mistakes||0;
 const safetyErrors=m.safety||0,portionErrors=m.portion||0;
 const accuracyErrors=Math.max(0,total-safetyErrors-portionErrors);
 const accuracy=Math.max(0,100-accuracyErrors*12);
 const safety=Math.max(0,100-safetyErrors*22);
 const portions=Math.max(0,100-portionErrors*25);
 const elapsed=Math.max(1,Math.round((Date.now()-(s.startedAt||Date.now()))/1000));
 // Pace expected is at least 45 seconds per step; this is a classroom simulation only.
 const target=Math.max(240,r.steps.length*45);
 const timing=elapsed<=target?100:Math.max(45,Math.round(100-(elapsed-target)/target*40));
 return {accuracy,safety,timing,portions,elapsed,target,total:Math.round(accuracy*.4+safety*.35+timing*.15+portions*.1)};
}
function bbLabAdvance(){const s=ui.labSession;if(!s)return;const r=bbLabRecipe(s.recipeId),step=bbLabStep(s);

 if(s.idx===r.steps.length-1){
  if(s.heatOn||s.activeAppliance)return bbLabNotify(s,'All simulated heating equipment must be OFF before serving.',true,'safety');
  const breakdown=bbLabGrade(s,r);const score=breakdown.total;let points=Math.max(10,Math.round(75*score/100));
  if(s.mode==='mission'){
   if(!completeMeal(s.d,s.meal,'guided',points))return bbLabNotify(s,'The planned meal was changed or pantry supplies are missing. Return to the meal planner.',true);
  }
  // Four-part grade determines both medal and earned mission points.
  bbLabStamp(s.recipeId,score,s.mode,breakdown);
  ui.labResult={recipeId:s.recipeId,mode:s.mode,score,breakdown,mistakes:s.mistakes,points:s.mode==='mission'?points:0};
  ui.labSession=null;bbLabSave();render();window.scrollTo({top:0,behavior:'instant'});return;
 }

}
function bbLabOperate(op,b){const s=ui.labSession,step=s&&bbLabStep(s);if(!step)return;

 if(bbLabStepDone(s,step))return bbLabNotify(s,'Step completed! Press Continue to move on.');
 const p=s.progress;
 switch(step.action){
 case 'sequence':case 'combine':{
  const expected=step.sequence[p.index||0];
  if(op!==expected?.id)return bbLabNotify(s,'Try the next action in the recipe order.',true,step.category||'accuracy');
  p.index=(p.index||0)+1;s.message=`${expected.label} — done.`;break;
 }
 case 'collect':{
  if(!step.required.includes(op))return bbLabNotify(s,'That tool is not needed for this recipe. Check the tool list.',true,'accuracy');
  p.selected=p.selected||[];if(!p.selected.includes(op))p.selected.push(op);
  s.message=`${bbLabData.toolCatalog[op]?.name||op} placed on the counter.`;break;
 }
 case 'measure':{
  p.amount=Math.round(((p.amount||0)+(op==='remove'?-step.increment:step.increment))*100)/100;
  if(p.amount<0)p.amount=0;
  if(p.amount>step.target+0.001){p.amount=Math.round((step.target+step.increment)*100)/100;return bbLabNotify(s,'A little too much! Use the minus button to correct your measurement.',true,'accuracy');}

 }
 case 'chop':{
  p.cuts=p.cuts||[];
  if(!/^slice-\d+$/.test(op))return;
  const n=Number(op.slice(6));if(n<0||n>=step.target||p.cuts.includes(n))return;
  p.cuts.push(n);s.message=p.cuts.length===step.target?'Careful cutting complete!':'Keep slicing carefully.';break;
 }
 case 'stir':{
  p.turns=Math.min(step.target,(p.turns||0)+1);
  s.message=p.turns===step.target?'Stirring task complete.':'Nice gentle stirring. Continue.';break;
 }
 case 'heat':{
  if(op!==step.state)return bbLabNotify(s,step.state==='on'?'Choose LOW heat to begin cooking.':'Turn the burner fully OFF.',true,'safety');
  s.heatOn=op==='on';p.done=true;s.message=op==='on'?'Burner on LOW. Stay nearby and stir.':'Burner OFF. Safe to move to serving.';break;
 }
 case 'timer':{
  if(op!=='check')return; p.checks=Math.min(step.target,(p.checks||0)+1);
  s.message=p.checks===step.target?'Simulation checkpoints finished. Follow real cooking directions for actual timing.':'Checkpoint completed. Monitor cooking safely.';break;
 }
 case 'portion':{
  if(op==='oversize')return bbLabNotify(s,'That portion is oversized. Try a fair serving for the whole family.',true,'portion');if(op!=='plate')return; p.plates=Math.min(step.target,(p.plates||0)+1);
  s.message=p.plates===step.target?'All servings plated!':'Portion served. Continue plating.';break;
 }
 case 'quiz':case 'method':{
  if(Number(op)!==Number(step.correct))return bbLabNotify(s,'Not quite. Review the preparation and food-safety guidance and try again.',true,step.category||'safety');

 }
 case 'appliance':{
  if(op!==step.state)return bbLabNotify(s,step.state==='on'?'Choose START to begin this simulated cooking method.':'Choose OFF to stop the equipment.',true,'safety');
  if(step.state==='on'){
   if(s.activeAppliance)return bbLabNotify(s,'Another appliance is already running. Switch it off first.',true,'safety');
   s.activeAppliance=step.mode;

   s.activeAppliance=null;

 }
 }
 bbLabSave();render();
}

function bbWorldInside(x,y,o){return x>=o.x&&y>=o.y&&x<o.x+o.w&&y<o.y+o.h;}

function bbWorldNearby(x,y,id){const o=BB_WORLD_STATIONS[id];if(!o)return false;

function bbWorldFindPath(tx,ty,station=null){const start=[bbWorld.x,bbWorld.y],q=[start],seen=new Set([start.join(',')]),came=new Map();let found=null;
 for(let head=0;head<q.length;head++){
  const [x,y]=q[head],key=x+','+y;
  if(station?bbWorldNearby(x,y,station):(x===tx&&y===ty)){found=key;break;}
  for(const [dx,dy] of [[0,-1],[-1,0],[1,0],[0,1]]){const nx=x+dx,ny=y+dy,nkey=nx+','+ny;if(!bbWorldBlocked(nx,ny)&&!seen.has(nkey)){seen.add(nkey);came.set(nkey,key);q.push([nx,ny]);}}

 return need;}

// Results V2: independent planned and served nutrition views. Benchmarks are educational
// age-group reference points, not personalized nutrition requirements or calorie goals.
const NUTRIENTS={protein:{title:'Protein',unit:'g',color:'#397c6c'},fiber:{title:'Fiber',unit:'g',color:'#397c6c'},sodium:{title:'Sodium',unit:'mg',color:'#ca7f34'},kcal:{title:'Energy',unit:'kcal',color:'#397c6c'},carbs:{title:'Carbohydrates',unit:'g',color:'#397c6c'},fat:{title:'Fat',unit:'g',color:'#397c6c'}};
function benchmarkFor(member){
  const age=member.age;
  // NASEM life-stage reference bands are sex-dependent from age 9 onward; show ranges,
  // not assumptions about each fictional member's sex or activity level.
  const prot=age<4?[13,13]:age<9?[19,19]:age<14?[34,34]:age<19?[46,52]:[46,56];
  const fiber=age<4?[19,19]:age<9?[25,25]:age<14?[26,31]:age<19?[26,38]:age<51?[25,38]:[21,30];
  const sodium=age<4?1200:age<9?1500:age<14?1800:2300;
  return {protein:{low:prot[0],high:prot[1],type:'minimum',label:prot[0]===prot[1]?`${prot[0]} g reference`:`${prot[0]}–${prot[1]} g reference band`},
          fiber:{low:fiber[0],high:fiber[1],type:'minimum',label:fiber[0]===fiber[1]?`${fiber[0]} g reference`:`${fiber[0]}–${fiber[1]} g reference band`},
          sodium:{low:sodium,high:sodium,type:'ceiling',label:`${sodium.toLocaleString()} mg upper comparison level`}};
}
function reportDay(member,day){
  const planned={kcal:0,protein:0,carbs:0,fiber:0,fat:0,sodium:0};
  const served={...planned};let plannedMeals=0,servedMeals=0;
  const keys=['kcal','protein','carbs','fiber','fat','sodium'];
  for(const meal of MEALS){const id=game.plan[day]?.[meal],recipe=REC[id];if(!recipe)continue;
    plannedMeals++;keys.forEach((k,i)=>planned[k]+=recipe.nutrition[i]*ageFactor(member.age));
    if(game.cooked[slotId(day,meal)]){servedMeals++;keys.forEach((k,i)=>served[k]+=recipe.nutrition[i]*ageFactor(member.age));}
  }
  return {day,planned,served,plannedMeals,servedMeals};
}
function sumReports(reports,kind){return Object.keys(NUTRIENTS).reduce((o,key)=>(o[key]=reports.reduce((n,r)=>n+r[kind][key],0),o),{});}
function nutrientBenchBars(reports,member,period){
  const targets=benchmarkFor(member),planned=sumReports(reports,'planned'),served=sumReports(reports,'served');
  const factor=period==='total'?1:1/game.days;
  return ['protein','fiber','sodium'].map(key=>{
    const guide=targets[key],unit=NUTRIENTS[key].unit,pl=planned[key]*factor,ac=served[key]*factor;
    const floor=guide.low*(period==='total'?game.days:1),high=guide.high*(period==='total'?game.days:1);
    const max=Math.max(1,pl,ac,high)*1.18;
    const safe=(x)=>Math.min(100,Math.max(0,x/max*100));
    return `<div class="compare-nutrient"><div class="compare-title"><strong>${NUTRIENTS[key].title}</strong><span class="small muted">${guide.type==='ceiling'?'Reference upper level':'Age-group reference'}: ${guide.label}${period==='total'?' × '+game.days+' days':''}</span></div>
    <div class="comp-row"><span>Planned</span><div class="comp-track"><i class="comp-fill plan" style="width:${safe(pl)}%"></i><i class="comp-guide" style="left:${safe(floor)}%"></i></div><strong>${neat(pl)} ${unit}</strong></div>
    <div class="comp-row"><span>Served</span><div class="comp-track"><i class="comp-fill cooked" style="width:${safe(ac)}%"></i><i class="comp-guide" style="left:${safe(floor)}%"></i></div><strong>${neat(ac)} ${unit}</strong></div>
    <div class="tiny muted">Dotted marker: ${guide.type==='ceiling'?'comparison ceiling':'lower reference edge'}${guide.high!==guide.low?' (range extends to '+neat(high)+' '+unit+')':''}. ${key==='sodium'?'Lower sodium is not automatically worse.':'Higher than the marker is not automatically better or worse.'}</div></div>`;
  }).join('');
}
function trendSVG(reports,metric,member){
  const label=NUTRIENTS[metric]?.title||'Energy',unit=NUTRIENTS[metric]?.unit||'kcal',ref=benchmarkFor(member)[metric]?.low||null;
  const w=680,h=270,left=48,right=18,top=26,bottom=44,plotH=h-top-bottom;
  const maximum=Math.max(1,...reports.flatMap(r=>[r.planned[metric],r.served[metric]]),ref||0)*1.18;
  const py=n=>top+plotH-Math.max(0,n/maximum)*plotH;
  const usable=w-left-right,group=usable/reports.length,barW=Math.min(28,group*.26);
  let out=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label} by day: teal bars planned, orange bars served${ref?', dashed line educational reference':''}" class="report-svg">`;
  for(let i=0;i<5;i++){const val=maximum*i/4,y=py(val);out+=`<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}" stroke="#d8e6db" stroke-width="1"/><text x="${left-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#64736d">${Math.round(val)}</text>`;}
  if(ref){const ry=py(ref);out+=`<line x1="${left}" y1="${ry}" x2="${w-right}" y2="${ry}" stroke="#985d32" stroke-width="2" stroke-dasharray="6 5"/><text x="${w-right-4}" y="${Math.max(12,ry-6)}" text-anchor="end" fill="#985d32" font-size="11" font-weight="700">Reference ${neat(ref)} ${unit}</text>`;}
  reports.forEach((r,i)=>{const mid=left+group*(i+.5),x1=mid-barW-2,x2=mid+2,v1=r.planned[metric],v2=r.served[metric];out+=`<rect x="${x1}" y="${py(v1)}" width="${barW}" height="${Math.max(0,top+plotH-py(v1))}" rx="4" fill="#4c9a80"><title>Day ${i+1} planned: ${neat(v1)} ${unit}</title></rect><rect x="${x2}" y="${py(v2)}" width="${barW}" height="${Math.max(0,top+plotH-py(v2))}" rx="4" fill="#e6a15e"><title>Day ${i+1} served: ${neat(v2)} ${unit}</title></rect><text x="${mid}" y="${h-18}" text-anchor="middle" font-size="12" fill="#203635">Day ${i+1}</text>`;});
  out+='</svg>';
  return out;
}
function foodGroupCompare(){const groups=['fruit','vegetable','protein','grains','dairy'];
  return groups.map(g=>{let planned=0,served=0;for(const slot of slots(game)){const r=REC[slot.recipeId];if(!r?.groups.includes(g))continue;planned++;if(game.cooked[slot.id])served++;}const max=Math.max(1,planned,served);return `<div class="foodgroup-item"><div class="inline-row" style="justify-content:space-between"><strong>${g[0].toUpperCase()+g.slice(1)}</strong><span class="small muted">${served} served / ${planned} planned meals</span></div><div class="mini-track"><i class="mini-plan" style="width:${planned/totalSlots(game)*100}%"></i><i class="mini-served" style="width:${served/totalSlots(game)*100}%"></i></div></div>`;}).join('');
}
function spendingChart(){

  return `<div class="stack"><div class="inline-row" style="justify-content:space-between"><strong>Budget ${money(game.budget)}</strong><span class="small muted">Spent ${money(spent)} · Left ${money(remaining)}</span></div><div class="budget-stack" role="img" aria-label="${money(spent)} spent of ${money(game.budget)}; ${money(expected)} more to buy"><span style="width:${pct}%" class="stack-spent"></span><span style="width:${next}%" class="stack-needed"></span></div><div class="graph-legend"><span><i class="key spent"></i>Purchased</span><span><i class="key planned"></i>Still needed</span><span><i class="key open"></i>Uncommitted</span></div><p class="small ${over?'danger-text':'muted'}">Expected additional grocery packages: <strong>${money(expected)}</strong>. ${over?'Your planned purchases exceed the budget by '+money(over)+'. Adjust recipes or package choices.':'Projected money remaining after buying the missing packages: '+money(Math.max(0,remaining-expected))+'.'}</p><h4>Where grocery money went</h4>${Object.keys(categories).length?Object.entries(categories).sort((a,b)=>b[1]-a[1]).map(([cat,value])=>`<div class="barrow"><label>${escape(cat)}</label><div class="progress"><i style="width:${value/largest*100}%;background:#4d9a80"></i></div><strong>${money(value)}</strong></div>`).join(''):'<p class="small muted">Shop for groceries to see spending by store aisle.</p>'}</div>`;
}

function recipeCards(arr,choosing=false){return `<div class="recipe-list">${arr.map(r=>{const allergy=blocked(game,r),all=tags(r);return `<article class="card recipe-card"><div class="recipe-art">${r.emoji}</div><div class="recipe-detail"><div class="inline-row" style="justify-content:space-between"><span class="eyebrow muted">${r.meal}</span><span class="small muted">${r.minutes} min</span></div><h3>${escape(r.name)}</h3><p>${escape(r.desc)}</p><div class="recipe-meta"><span>${money(rawCost(r)*amountMultiplier(game))} ingredient value</span><span>${r.nutrition[0]} kcal/serving</span></div><div class="chips">${all.length?all.map(x=>`<span class="allergy">${escape(x)}</span>`).join(''):'<span class="chip good">No common allergens tagged</span>'}</div><button class="btn ${allergy.length?'outline':'primary'} full" data-action="recipe-details" data-recipe="${r.id}">${choosing?(allergy.length?'⚠ Check allergy':'Choose / Details'):'View recipe'} →</button></div></article>`;}).join('')}</div>`;}
function modalView(){const m=ui.modal;if(!m)return '';let title='',body='';
 if(m.type==='choose'||m.type==='recipes'){
 const meal=m.type==='choose'?m.meal:ui.recipeFilter;
 const list=BB_RECIPES.filter(r=>(meal==='All'||r.meal===meal)&&(r.name.toLowerCase().includes(ui.search.toLowerCase())||r.desc.toLowerCase().includes(ui.search.toLowerCase())||Object.keys(r.ingredients).some(id=>ING[id]?.name.toLowerCase().includes(ui.search.toLowerCase())))).sort((a,b)=>rawCost(a)-rawCost(b));
 title=m.type==='choose'?`Choose ${m.meal} for Day ${m.d+1}`:'Recipe Library';
 body=`<div class="filterbar">${m.type==='recipes'?['All',...MEALS].map(cat=>`<button class="btn sm ${ui.recipeFilter===cat?'primary':'outline'}" data-action="recipe-filter" data-meal="${cat}">${cat}</button>`).join(''):''}</div><form id="recipe-search" class="form-row" style="margin-bottom:15px"><div class="field"><label for="search-term">Find a recipe</label><input id="search-term" name="search" placeholder="Recipe name" value="${escape(ui.search)}"/></div><button class="btn outline" type="submit">Search</button></form>${list.length?recipeCards(list,m.type==='choose'):'<div class="empty">No matching recipes. Try another name.</div>'}`;
 }else if(m.type==='recipe-detail'){
 const r=REC[m.id];if(!r)return '';const allergy=blocked(game,r),ingredientList=recipeIngredients(r);title=r.emoji+' '+r.name;
 body=`<p class="muted" style="margin-bottom:14px">${escape(r.desc)} · ${r.minutes} min · ${r.skill} · Serves 4 standard portions (scaled for your household).</p><div class="grid2"><div class="stack"><h3>Ingredients for your family</h3>${ingredientList.map(x=>`<div class="inline-row" style="justify-content:space-between;border-bottom:1px solid #e2e5d9;padding:8px 0"><span class="small">${escape(x.ing.name)}</span><span class="chip">${neat(x.qty)} ${escape(x.ing.unit)}</span></div>`).join('')}</div><div class="stack"><h3>Estimated nutrition / standard serving</h3><div class="chips">${[['Calories',r.nutrition[0]+' kcal'],['Protein',r.nutrition[1]+' g'],['Carbs',r.nutrition[2]+' g'],['Fiber',r.nutrition[3]+' g'],['Fat',r.nutrition[4]+' g'],['Sodium',r.nutrition[5]+' mg']].map(([k,v])=>`<span class="chip">${k}: ${v}</span>`).join('')}</div><h3>How to prepare it</h3><div class="stack" style="gap:7px">${r.method.map((st,i)=>`<div class="task"><div class="bubble">${i+1}</div><p class="small">${escape(st)}</p></div>`).join('')}</div><h3>Safety skills you'll practice</h3><p class="small muted">${r.steps.map(st=>escape(st.name)).join(' → ')}</p><div class="callout ${allergy.length?'error':''}"><strong>${allergy.length?'⚠ Conflicts with your household allergy flags':'Allergen awareness'}</strong><span class="small">${allergy.length?'Flagged: '+allergy.join(', ')+'. Choose another recipe.':tags(r).length?'Recipe ingredients tagged: '+tags(r).join(', ')+'.':'No common allergens tagged in this simulated ingredient list.'} Always read real labels.</span></div></div></div>
 <div class="inline-row" style="margin-top:19px">${m.choose?`<button class="btn primary" data-action="assign-recipe" data-recipe="${r.id}" ${allergy.length?'disabled':''}>Add to Day ${m.choose.d+1} ${m.choose.meal}</button>`:''}<button class="btn outline" data-action="back-recipes">← Back to recipe list</button></div>`;
 }else if(m.type==='member'){
 const member=m.id?game.family.find(p=>p.id===m.id):null;title=member?'Edit family member':'Add a family member';
 body=`<form id="member-form" class="stack"><div class="grid2"><div class="field"><label for="member-name">First name or nickname</label><input id="member-name" name="name" minlength="1" maxlength="32" value="${escape(member?.name||'')}" placeholder="e.g. Alex" required/></div><div class="field"><label for="member-age">Age (3–100)</label><input id="member-age" type="number" name="age" min="3" max="100" value="${member?.age||12}" required/></div></div><div><strong>Food allergen flags</strong><p class="small muted">Select any simulated allergens this household member needs to avoid. This is a learning safeguard, not a food-safety certification.</p></div><div class="allergy-picker">${ALLERGENS.map(a=>`<label class="check-pill"><input type="checkbox" name="allergy" value="${a}" ${member?.allergies?.includes(a)?'checked':''}/>${escape(a)}</label>`).join('')}</div><div class="callout warning"><strong>Real-life safety</strong><span class="small">Actual product labels and cross-contact need to be checked. Do not use this simulator to decide whether a real meal is safe for someone with allergies.</span></div><button class="btn primary" type="submit">Save family member</button></form>`;
 }else if(m.type==='help'){
 title='How to play Budget Bites';body=`<div class="stack">${[['1. Create your household','Add fictional family members, their ages, and any simulated allergy flags. Set a multi-day grocery budget.'],['2. Fill your menu','Choose breakfasts, lunches, dinners, and snacks. Try to include a variety of food groups.'],['3. Shop by the package','Food comes in packages of different sizes. Reuse ingredients and compare unit prices to avoid wasting money.'],['4. Cook your meals','Enter the 16-bit kitchen from the Recipe Box. Walk with WASD or arrow keys, press E by the highlighted station, or click to walk. Practice is free; mission cooking uses pantry ingredients. Guided Cooking and Quick Cook remain available.'],['5. Review your results','Check expenses, recipes served, food groups, and rough nutrition totals per person. Then improve your plan.']].map(([h,t])=>`<div class="task"><div class="bubble">✓</div><div><strong>${h}</strong><p class="small muted">${t}</p></div></div>`).join('')}<div class="callout warning"><strong>Educational simulation only</strong><span class="small">Ingredient prices and nutrition are estimates; age-based portions are simplified. Always cook with appropriate adult supervision and check actual packaging for allergens.</span></div></div>`;
 }else if(m.type==='new'){
 title='Start a new food mission?';body=`<div class="stack"><p>Choose whether to clear your current mission but keep the household, or erase all saved game progress and return to the original starter household. Both options also reset any unfinished interactive recipe. Export a backup first if you want a copy.</p><div class="inline-row"><button class="btn outline" data-action="export">⬇ Export backup</button><button class="btn danger" data-action="confirm-reset">Reset mission (keep family)</button><button class="btn danger" data-action="full-reset">Erase everything and start fresh</button><button class="btn outline" data-action="close-modal">Cancel</button></div></div>`;
 }else if(m.type==='import'){
 title='Restore a saved food mission';body=`<div class="stack"><p>This replaces your current game with the data from a Budget Bites JSON backup. Export your current mission first if needed.</p><div class="field"><label for="import-file">JSON backup file</label><input type="file" id="import-file" accept=".json,application/json"/></div><div class="inline-row"><button class="btn primary" data-action="do-import">Import and replace mission</button><button class="btn outline" data-action="close-modal">Cancel</button></div></div>`;
 }
 return `<div class="modal-backdrop" id="backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="${escape(title)}"><div class="modal-top"><h2>${escape(title)}</h2><button class="icon-button" data-action="close-modal" aria-label="Close dialog">✕</button></div>${body}</section></div>`;}
function render(){const views={Home:homeView,Family:familyView,Planner:plannerView,Market:marketView,Kitchen:kitchenView,Results:reportView};$('#app').innerHTML=shell((views[ui.tab]||homeView)());document.title='Budget Bites · '+ui.tab+' | Naches Learning Hub';bbWorldMount();}
function download(filename,content,mime='text/plain'){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const el=document.createElement('a');el.href=url;el.download=filename;document.body.append(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function csv(rows){return rows.map(row=>row.map(cell=>{let x=String(cell??'');if(/^[\s]*[=+@-]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');}
function exportBackup(){download('budget-bites-mission-backup.json',JSON.stringify({app:'Budget Bites',exportedAt:new Date().toISOString(),data:game},null,2),'application/json');}
function exportPlan(){download('budget-bites-meal-plan.csv',csv([['Day','Meal','Recipe','Estimated kcal/standard serving','Allergens'],...slots(game).map(s=>[s.d+1,s.meal,REC[s.recipeId]?.name||'',REC[s.recipeId]?.nutrition?.[0]||'',tags(REC[s.recipeId]||{ingredients:{}}).join('; ')])]),'text/csv');}
function exportGroceries(){download('budget-bites-shopping-list.csv',csv([['Ingredient','Need total','Unit','Pantry stock','Packs to buy','Price per pack','Cost'],...groceryList().map(x=>[x.ing.name,neat(x.total),x.ing.unit,neat(x.have),x.packs,x.ing.price,x.cost])]),'text/csv');}
function exportResults(){const header=['Name','Age','Average kcal/day','Protein g/day','Carbs g/day','Fiber g/day','Fat g/day','Sodium mg/day','Total kcal/mission','Total protein g','Total carbs g','Total fiber g','Total fat g','Total sodium mg','Served meals','Mission days','Total spent','Remaining budget'];const rows=game.family.map(m=>{let x=nutritionForMember(m),t=nutritionForMember(m,'total');return [m.name,m.age,...['kcal','protein','carbs','fiber','fat','sodium'].map(k=>neat(x[k])),...['kcal','protein','carbs','fiber','fat','sodium'].map(k=>neat(t[k])),cookCount(game),game.days,money(game.spent),money(balance())];});download('budget-bites-nutrition-report.csv',csv([header,...rows]),'text/csv');}
function resetMission(){const members=JSON.parse(JSON.stringify(game.family)),days=game.days,budget=game.budget;game=defaultState();game.family=members;game.days=days;game.budget=budget;game.started=true;game.plan=Array.from({length:days},()=>Object.fromEntries(MEALS.map(m=>[m,null])));ui.session=null;bbLabClear();ui.modal=null;ui.tab='Family';save();notify('A new mission is ready. Your fictional family was kept; menu, groceries and results reset.');}
function restoreData(data){if(!data||data.version!==1||!Array.isArray(data.family)||!Array.isArray(data.plan)||!data.inventory||!data.cooked||typeof data.budget!=='number')throw Error('Not a compatible Budget Bites backup.');
 if(data.days<3||data.days>7||data.family.length<1||data.family.length>14||!Number.isFinite(data.budget)||data.budget<20||data.budget>10000)throw Error('This backup has invalid settings.');
 const clean=defaultState();clean.days=data.days;clean.budget=data.budget;clean.spent=Math.max(0,Number(data.spent)||0);clean.points=Math.max(0,Number(data.points)||0);clean.started=true;
 clean.family=data.family.map(m=>({id:String(m.id||uid()).slice(0,35),name:String(m.name||'Family member').slice(0,32),age:Math.max(3,Math.min(100,Number(m.age)||12)),allergies:(Array.isArray(m.allergies)?m.allergies:[]).filter(x=>ALLERGENS.includes(x))}));
 clean.plan=Array.from({length:data.days},(_,d)=>Object.fromEntries(MEALS.map(meal=>[meal,REC[data.plan[d]?.[meal]]?.id||null])));
 clean.inventory=Object.fromEntries(Object.entries(data.inventory).filter(([id,value])=>ING[id]&&Number.isFinite(Number(value))&&Number(value)>=0&&Number(value)<10000).map(([id,v])=>[id,Number(v)]));
 clean.cooked={};for(const [id,obj] of Object.entries(data.cooked)){const [day,meal]=id.split('-');const d=Number(day);if(d>=0&&d<data.days&&MEALS.includes(meal)&&obj?.recipeId===clean.plan[d]?.[meal])clean.cooked[id]={recipeId:obj.recipeId,mode:obj.mode==='guided'?'guided':'quick',points:Math.max(0,Number(obj.points)||0),at:String(obj.at||'')};}
 clean.receipts=Array.isArray(data.receipts)?data.receipts.slice(0,500).filter(x=>ING[x.item]).map(x=>({date:String(x.date||''),item:x.item,packs:Math.max(0,Number(x.packs)||0),cost:Math.max(0,Number(x.cost)||0)})):[];
 return clean;}
function act(action,b){switch(action){
case 'lab-box':ui.labZoom=false;ui.labBox=true;ui.labSession=null;ui.tab='Kitchen';ui.labResult=null;render();break;
 case 'lab-box-exit':ui.labBox=false;ui.tab='Kitchen';render();break;
 case 'lab-start':bbLabStart(b.dataset.recipe);break;
 case 'lab-start-mission':bbLabStart(b.dataset.recipe,'mission',Number(b.dataset.day),b.dataset.meal);break;
 case 'lab-resume':{const saved=bbLabSaved();if(saved){ui.labZoom=false;ui.labSession=saved;ui.labBox=false;ui.tab='Kitchen';render();}else notify('No saved interactive lesson was found.',true);break;}
 case 'lab-read':ui.modal={type:'recipe-detail',id:b.dataset.recipe,choose:null};render();break;
 case 'lab-filter':ui.labFilter=b.dataset.filter;render();break;
 case 'lab-station':bbLabStation(b.dataset.station);break;
 case 'lab-closeup':ui.labZoom=false;bbWorld.keys.clear();render();break;
 case 'world-travel':bbWorldTravel(b.dataset.station);break;
 case 'world-interact':bbWorldInteract();break;
 case 'world-move':bbWorldMoveOnce(b.dataset.dir);break;
 case 'lab-do':bbLabOperate(b.dataset.op,b);break;
 case 'lab-next':bbLabAdvance();break;
 case 'lab-restart':if(confirm('Restart this interactive recipe from the beginning?')){const s=ui.labSession;bbLabStart(s.recipeId,s.mode,s.d,s.meal);}break;
 case 'lab-save-exit':ui.labSession=null;ui.labBox=true;ui.tab='Kitchen';render();break;
 case 'full-reset':if(confirm('Erase the entire Budget Bites mission, household, purchases, points, and cooking lesson? This cannot be undone unless you exported a backup.')){game=defaultState();bbLabClear();try{localStorage.removeItem(BB_LAB_BADGES_STORE);}catch(e){}ui.session=null;ui.modal=null;ui.tab='Home';ui.selectedCookDay=0;save();notify('Budget Bites has been fully reset to the starter game.');}break;
 case 'navigate':go(b.dataset.tab);break;
case 'begin':game.started=true;save();if(!slots(game).some(s=>s.recipeId))setAutoPlan(false);go('Family');break;
case 'help':ui.modal={type:'help'};render();break;
case 'close-modal':ui.modal=null;render();break;
case 'add-member':ui.modal={type:'member'};render();break;
case 'edit-member':ui.modal={type:'member',id:b.dataset.id};render();break;
case 'remove-member':if(game.family.length<=1)return; if(!confirm('Remove this fictional family member? Their portion needs will change.'))return;game.family=game.family.filter(x=>x.id!==b.dataset.id);save();notify('Family member removed. Shopping quantities were recalculated.');break;
case 'auto-plan':setAutoPlan(false);break;
case 'budget-plan':setAutoPlan(true);break;
case 'choose':ui.chooseDay=Number(b.dataset.day);ui.chooseMeal=b.dataset.meal;ui.search='';ui.modal={type:'choose',d:ui.chooseDay,meal:ui.chooseMeal};render();break;
case 'view-recipes':ui.recipeFilter='All';ui.search='';ui.modal={type:'recipes'};render();break;
case 'recipe-filter':ui.recipeFilter=b.dataset.meal;render();break;
case 'recipe-details':{const original=ui.modal;ui.modal={type:'recipe-detail',id:b.dataset.recipe,choose:original.type==='choose'?{d:original.d,meal:original.meal}:null};render();break;}
case 'back-recipes':ui.modal=ui.chooseMeal&&ui.modal?.choose?{type:'choose',d:ui.chooseDay,meal:ui.chooseMeal}:{type:'recipes'};render();break;
case 'assign-recipe':{const m=ui.modal,r=REC[b.dataset.recipe];if(!m?.choose||!r)return;const d=m.choose.d,meal=m.choose.meal;if(game.cooked[slotId(d,meal)])return notify('Already served meals cannot be replaced.',true);if(r.meal!==meal||blocked(game,r).length)return notify('That meal is not safe for the selected slot.',true);game.plan[d][meal]=r.id;ui.modal=null;save();notify(r.name+' added to Day '+(d+1)+' '+meal+'.');break;}
case 'aisle':ui.aisle=b.dataset.aisle;render();break;
case 'buy':buy(b.dataset.item,Math.max(1,Number(b.dataset.count)||1));break;
case 'buy-missing':buyMissing();break;
case 'cook-day':ui.selectedCookDay=Number(b.dataset.day);render();break;
case 'guided':startCook(Number(b.dataset.day),b.dataset.meal);break;
case 'quick':{const ok=completeMeal(Number(b.dataset.day),b.dataset.meal,'quick',5);notify(ok?'Meal served! +5 planning points.':'Cannot cook this meal. Check pantry, plan, and allergies.',!ok);break;}
case 'quick-day':bulkCook(true);break;
case 'quick-all':bulkCook(false);break;
case 'answer':answerKitchen(b.dataset.answer);break;
case 'continue-step':if(ui.session){const r=REC[game.plan[ui.session.d]?.[ui.session.meal]];const steps=r&&guidance(r);if(steps&&steps[ui.session.idx]&&!steps[ui.session.idx].question){ui.session.idx++;if(ui.session.idx>=steps.length){const points=Math.round(10+ui.session.correct*12-Math.min(12,ui.session.attempts*2));const ok=completeMeal(ui.session.d,ui.session.meal,'guided',points);ui.session=null;notify(ok?'Meal complete! +'+points+' kitchen points.':'Meal could not be served.',!ok);}else render();}}break;
case 'leave-kitchen':if(confirm('Leave guided cooking? No ingredients will be used, and this safety quiz will restart next time.')){ui.session=null;render();}break;
case 'export':exportBackup();break;
case 'export-plan':exportPlan();break;
case 'export-grocery':exportGroceries();break;
case 'export-report':exportResults();break;
case 'report-member':ui.reportMember=b.dataset.member;render();break;
case 'report-metric':ui.trendMetric=['fiber','protein','sodium','kcal','carbs','fat'].includes(b.dataset.metric)?b.dataset.metric:'fiber';render();break;
case 'report-period':ui.reportPeriod=b.dataset.period==='total'?'total':'daily';render();break;
case 'new-mission':ui.modal={type:'new'};render();break;
case 'confirm-reset':resetMission();break;
case 'import':ui.modal={type:'import'};render();break;
case 'do-import':{const file=$('#import-file')?.files?.[0];if(!file)return notify('Choose a JSON backup file first.',true);if(file.size>5_000_000)return notify('Backup is too large.',true);file.text().then(content=>{try{const parsed=JSON.parse(content),restored=restoreData(parsed.data||parsed);if(!confirm('Replace current saved mission with this backup?'))return;game=restored;ui.modal=null;ui.session=null;bbLabClear();ui.tab='Home';save();notify('Backup restored successfully.');}catch(e){notify(e.message||'Could not read the backup.',true);}}).catch(()=>notify('File could not be read.',true));break;}
}}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='bb-v7-level'){ui.labDifficulty=e.target.value;render();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();act(b.dataset.action,b);return;}if(e.target.id==='backdrop'){ui.modal=null;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render();}
 if(!ui.labSession||ui.tab!=='Kitchen'||ui.labZoom||ui.modal||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
 const dirs={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
 const dir=dirs[e.key]||dirs[e.key.toLowerCase?.()];if(dir){e.preventDefault();if(!e.repeat)bbWorldMoveOnce(dir);bbWorld.keys.add(dir);return;}
 if((e.key==='e'||e.key==='E'||e.key===' ')&&!e.repeat){if(e.key===' '&&document.activeElement?.tagName==='BUTTON')return;e.preventDefault();bbWorldInteract();}
});
document.addEventListener('keyup',e=>{const dirs={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};const dir=dirs[e.key]||dirs[e.key.toLowerCase?.()];if(dir)bbWorld.keys.delete(dir);});
window.addEventListener('blur',()=>bbWorld.keys.clear());
document.addEventListener('submit',e=>{if(e.target.id==='settings-form'){e.preventDefault();const budget=Number($('#budget')?.value),days=Number($('#days')?.value)||game.days;if(!Number.isFinite(budget)||budget<20||budget>2000)return notify('Choose a grocery budget between $20 and $2,000.',true);if(budget<game.spent)return notify('Budget cannot be less than money you already spent.',true);if(cookCount(game)&&days!==game.days)return notify('Start a new mission before changing the number of days.',true);game.budget=budget;if(days!==game.days){game.days=days;game.plan=Array.from({length:days},(_,i)=>game.plan[i]||Object.fromEntries(MEALS.map(m=>[m,null])));ui.selectedCookDay=0;}save();notify('Household settings saved.');}
 else if(e.target.id==='member-form'){e.preventDefault();const n=$('#member-name').value.trim().slice(0,32),age=Number($('#member-age').value),allergies=[...e.target.querySelectorAll('input[name=allergy]:checked')].map(x=>x.value);if(!n||age<3||age>100)return notify('Enter a name and an age from 3 to 100.',true);const existing=ui.modal?.id&&game.family.find(x=>x.id===ui.modal.id);if(existing)Object.assign(existing,{name:n,age,allergies});else{if(game.family.length>=14)return notify('Limit the household to 14 family members.',true);game.family.push({id:uid(),name:n,age,allergies});}ui.modal=null;save();notify('Household updated. Review allergy flags in your meal plan.');}
 else if(e.target.id==='lab-recipe-search'){e.preventDefault();ui.labQuery=String(e.target.querySelector('[name=search]').value||'').trim().slice(0,70);render();}
 else if(e.target.id==='recipe-search'){e.preventDefault();ui.search=String(e.target.querySelector('[name=search]').value||'').trim().slice(0,70);render();}});
if(!game.started&&game.plan.every(day=>MEALS.every(meal=>!day[meal]))){/* New player sees a prominent start button. */}
const savedKitchenSession=bbLabSaved();if(savedKitchenSession){ui.labSession=savedKitchenSession;ui.tab='Kitchen';}
render();bbLabInstallExternal();
})();
